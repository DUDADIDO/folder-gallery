name: Gallery
options:
  bundleIdPrefix: com.dudadido
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
targets:
  Gallery:
    type: application
    platform: iOS
    sources:
      - path: Sources
    scheme:
      testTargets: []
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 갤러리
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 사진을 카메라·스크린샷·저장한 사진 폴더로 나눠 보여 주고, 고른 사진을 옮기거나 지우기 위해 사진 보관함에 접근합니다.
        NSPhotoLibraryAddUsageDescription: 폴더(앨범)를 만들고 사진을 넣기 위해 사진 보관함에 접근합니다.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSFaceIDUsageDescription: 숨긴 앨범을 열 때 Face ID 로 본인 확인을 합니다.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dudadido.gallery
        PRODUCT_NAME: Gallery
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
